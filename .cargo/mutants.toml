# cargo-mutants configuration.
#
# Every entry below is an EQUIVALENT mutant: the mutated program computes the
# same answer as the original for every input, so no test can kill it and a
# test that appeared to would be testing something else.  Each carries the
# address in `orig/g.exe` the boundary models -- resolved with
# `python3 tools/re_query.py resolve <citation>`, never hand-derived -- and the
# argument is written out in `docs/re/combat.md`, "Boundaries that cannot be
# observed".  An unexplained skip is worse than a missed mutant, so nothing
# goes in this list without both.
#
# The regexps are anchored on `file:line:col`, so they FAIL OPEN: if the code
# moves, the exclusion stops matching and cargo-mutants reports the mutant as
# missed again rather than silently covering a different one.  That is the
# intended failure mode -- re-derive the argument, then move the line number.
#
# `src/combat.rs`'s the_blow_budget_boundaries_are_unobservable is the
# regression test for the first two: it does not kill them (nothing can), it
# goes red if the constant identity they rest on is ever broken.
exclude_re = [
    # `1000:3fbb` `cmp mine,0x0a` / `1000:3fc0` `jle 0x3fec` guards the loop,
    # and `1000:3fe2` `mov mine,0x0a` is what the loop collapses to -- the
    # same 10.  At `mine == 10` the guard's two senses agree: skipping the
    # loop returns 10, and entering it either leaves at once or collapses to
    # 10.
    "^src/combat\\.rs:162:13: replace > with >= in blow_budget$",

    # `1000:3fc9` `cmp mine,0x1c` / `1000:3fce` `jl 0x3fe2` collapses below
    # 28, and `1000:3fd4` `sub ax,0x12` is the step: `0x1c - 0x12 == 0x0a`,
    # the collapse value.  At `mine == 28` one more turn round the loop lands
    # exactly ON the collapse, so collapsing early changes nothing.
    "^src/combat\\.rs:168:21: replace < with <= in blow_budget$",

    # `1000:454f` `cmp word [bp-0x10c],0x0` / `1000:4554` `jnl 0x455c` floors
    # the post-armour damage with `1000:4556` `xor ax,ax`.  The value stored
    # IS the bound tested, so extending the test to `<= 0` writes 0 over a 0.
    "^src/combat\\.rs:434:15: replace < with <= in resolve_blow_nth$",

    # Resolved with `python3 tools/re_query.py resolve 1000:b251 -n 32 -i 10`:
    # `b251 mov ax,[0x38ac]` / `b254 cmp ax,[0x38ae]` / `b258 jnl 0xb26e` is the
    # ring's guard, `b25a add word [0x38ac],0x3` the grant, and
    # `b25f mov ax,[0x38ac]` / `b262 cmp ax,[0x38ae]` / `b266 jle 0xb26e` /
    # `b268`..`b26b` the clamp back to hpmax -- one hp (`0x38ac`) tested twice
    # against one hpmax (`0x38ae`).  The guard and the clamp bound the SAME
    # value, so widening the guard to `<=` adds 3 at full health and the clamp
    # takes it straight off again: every reachable state is identical.
    "^src/game\\.rs:3567:31: replace < with <= in Game::wander_preamble$",

    # The clamp's own boundary, `b262`/`b266` above.  `hp > hpmax` widened to
    # `>=` only differs when the two are already equal, and there `b268`..`b26b`
    # writes hpmax over hpmax.
    "^src/game\\.rs:3569:35: replace > with >= in Game::wander_preamble$",

    # `1000:b2e3` is the Гопник arm of the class-perk dispatch and it does
    # NOTHING -- the original jumps straight to the convergence at `1000:b34d`.
    # The port writes it as an explicit `5 => {}` so every class in the
    # original's chain has a visible arm.  Deleting it falls through to the
    # `_ => {}` default, which is the same empty body, so no input can tell
    # the two apart.
    "^src/game\\.rs:3601:13: delete match arm 5 in Game::wander_preamble$",

    # Resolved with `python3 tools/re_query.py resolve 1000:0d91 -n 48 -i 16`,
    # from the `call 0f78:114b` at `0d91` so the walk starts aligned:
    # `0d9a cmp word [0x3952],0x9` / `0d9f jle 0xda7` / `0da1 mov word
    # [0x3952],0x9`.  The bound TESTED is the value STORED, so widening the
    # test to `>=` writes 9 over a 9.  Same argument as `resolve_blow_nth`
    # above -- a clamp whose constant appears on both sides cannot observe the
    # difference between `>` and `>=`.
    "^src/game\\.rs:4074:16: replace > with >= in Game::roll_enemy$",

    # The `param_1 == 1` clamp, four instructions later and the same shape:
    # `0dad cmp word [0x3952],0x7` / `0db2 jle 0xdba` / `0db4 mov word
    # [0x3952],0x7`.
    "^src/game\\.rs:4077:32: replace > with >= in Game::roll_enemy$",
]
