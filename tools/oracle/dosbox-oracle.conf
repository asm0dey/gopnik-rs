### DOSBox-X configuration for the ground-truth oracle (Task 3).
###
### The harness (capture.py) supplies the rest of the invocation:
### -nogui -fastlaunch -exit -time-limit N -c scrhook.com -c g.exe, run with
### SDL_VIDEODRIVER=dummy and cwd set to the scratch work directory, which is
### what "mount c ." below picks up. Nothing here may reference orig/ -- the
### game writes .SAV files as it runs and the corpus is read-only.

[sdl]
autolock=false
windowresolution=640x400
output=surface

[dosbox]
machine=vgaonly
captures=capture
memsize=16

[render]
aspect=false

[cpu]
core=normal
cputype=386
cycles=fixed 3000

[dos]
# No keyboardlayout= line on purpose. The original's own DOSBox fragment
# (recovered in gopnik.data) used keyboardlayout=RU, and ru446 is the
# DOSBox-X spelling that also loads CP866 as the display codepage -- but this
# host ships no layout files at all (/usr/share/dosbox-x has no keyboard
# resources), so asking for one only logs "Keyboard layout file ru446 not
# found". Nothing in the capture path depends on it: screen text is read out
# of the text-mode buffer as raw CP866 bytes and keystrokes are injected as
# CP866 characters, both of which sit below the layout and the display
# codepage. It matters only for rendering glyphs to a window.
xms=true
ems=true

[autoexec]
mount c .
c:
