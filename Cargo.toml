[package]
name = "gopnik"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"

[dependencies]
encoding_rs = "0.8"
colored = "3"

[build-dependencies]
serde = "1"
serde_json = "1"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
opt-level = "z"
strip = true
